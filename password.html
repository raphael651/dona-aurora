<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #141e30, #243b55);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      color: white;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #64748b;
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 15px;
    }

    input::placeholder {
      color: #cbd5e1;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 65px;
    }

    .toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: #7dd3fc;
      cursor: pointer;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }

    .options input {
      width: auto;
    }

    a {
      color: #7dd3fc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #0f172a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }

    #message {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
    }

    .signup {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>Welcome Back!</h1>
    <p class="subtitle">Please log in to your account</p>

    <form id="loginForm">
      <div class="input-group">
        <label for="email">Enter your LRN</label>
        <input
          type="LRN"
          id="LRN"
          placeholder="Enter your LRN"
          autocomplete="LRN"
          required
        >
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button
            type="button"
            class="toggle"
            id="togglePassword"
          >Show</button>
        </div>
      </div>

      <div class="options">
        <label>
          <input type="checkbox" id="remember">
          Remember me
        </label>
        <a href="#" id="forgotLink">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">
        Log In
      </button>

      <p id="message" role="status"></p>
    </form>

    <p class="signup">
      Don't have an account?
      <a href="#" id="https://dormehi-portal.duckdns.org">Sign up</a>
    </p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const toggle = document.getElementById("togglePassword");
    const message = document.getElementById("message");

    toggle.addEventListener("click", function () {
      const hidden = password.type === "password";
      password.type = hidden ? "text" : "password";
      toggle.textContent = hidden ? "Hide" : "Show";
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      message.style.color = "#7dd3fc";
      message.textContent =
        "Demo only: connect a secure login backend to authenticate.";
    });

    document.getElementById("forgotLink")
      .addEventListener("click", function (event) {
        event.preventDefault();
        message.style.color = "#7dd3fc";
        message.textContent =
          "Password reset is not configured yet.";
      });

    document.getElementById("signupLink")
      .addEventListener("click", function (event) {
        event.preventDefault();
        message.style.color = "#7dd3fc";
        message.textContent =
          "Sign-up page is not configured yet.";
      });
  </script>
</body>
</html>
